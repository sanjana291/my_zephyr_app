CONFIG_NETWORKING=y
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
# CONFIG_NET_TCP_IPV6_ND_REACHABILITY_HINT=y
CONFIG_NET_STATISTICS=y

CONFIG_NET_PKT_RX_COUNT=64
#40
CONFIG_NET_PKT_TX_COUNT=64
#40
CONFIG_NET_BUF_RX_COUNT=160
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_NET_BUF_DATA_SIZE=1536
# CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=4
# CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=5
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=-1
CONFIG_ZVFS_POLL_MAX=9

CONFIG_INIT_STACKS=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SHELL=y

CONFIG_NET_CONFIG_SETTINGS=y
# CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
# CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.12"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.15"

CONFIG_LOG=y
CONFIG_SHELL_CMDS_RESIZE=n

CONFIG_CACHE_MANAGEMENT=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_TIMESLICING=n

# For speed optimizations
CONFIG_PICOLIBC_USE_MODULE=y


CONFIG_ETH_PHY_DRIVER=y
CONFIG_ETH_DRIVER=y
CONFIG_PHY_TI_DP83822=y

CONFIG_ZPERF_SESSION_PER_THREAD=y

# Speak iperf3 instead of iperf2. The zperf commands stay the same, and
# the default port becomes 5201.
# CONFIG_NET_ZPERF_IPERF3=y

# An iperf3 test takes a control connection and a data stream on each
# end, on top of the server's listening sockets, and closed connections
# linger in TIME_WAIT for a while after each test.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16

# CONFIG_PHY_LOG_LEVEL_DBG=y

# Increase NXP ENET driver buffer allocation
CONFIG_ETH_NXP_ENET_RX_BUFFERS=16
CONFIG_ETH_NXP_ENET_TX_BUFFERS=16

# Expand TCP send/receive windows to prevent stalling at 100 Mbps
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768